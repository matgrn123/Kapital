<title>Kapital V1 maquette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre de jeu en haut, rail de navigation à gauche, scène ou écran de gestion au centre. Denim (indigo) + fil d'or (ocre). */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17202E; --muted:#5B6576; --line:#D6DCE4;
  --accent:#2D4A9E; --accent-soft:#E2E8F7; --on-accent:#FFFFFF;
  --thread:#9A6410; --thread-soft:#F5EAD3;
  --good:#1F7A49; --good-soft:#DDF0E4; --bad:#B0362A; --bad-soft:#F7E0DC;
  --sky-top:#BCD8EA; --sky-bot:#E4EEF2; --scene-dim:1;
  --shadow:0 1px 2px rgba(23,32,46,.06),0 6px 20px rgba(23,32,46,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171D26; --surface-2:#1D2430; --ink:#E5E9F0; --muted:#9AA3B2; --line:#2B3443;
  --accent:#8EA6F2; --accent-soft:#222C48; --on-accent:#0F131A;
  --thread:#E2AC52; --thread-soft:#352A17;
  --good:#5CC48B; --good-soft:#163525; --bad:#F08575; --bad-soft:#3B1E1A;
  --sky-top:#22364C; --sky-bot:#3A4D60; --scene-dim:.86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171D26; --surface-2:#1D2430; --ink:#E5E9F0; --muted:#9AA3B2; --line:#2B3443;
  --accent:#8EA6F2; --accent-soft:#222C48; --on-accent:#0F131A;
  --thread:#E2AC52; --thread-soft:#352A17;
  --good:#5CC48B; --good-soft:#163525; --bad:#F08575; --bad-soft:#3B1E1A;
  --sky-top:#22364C; --sky-bot:#3A4D60; --scene-dim:.86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
small{font-size:.78rem}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
  padding-block:12px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.brand small{color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:0}
.stat .eyebrow{font-size:.62rem;display:block}
.stat b{font-size:.95rem;font-variant-numeric:tabular-nums}
.stat .mini{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:3px;width:88px;overflow:hidden}
.stat .mini i{display:block;height:100%;background:var(--accent)}
.stat.desir .mini i{background:var(--thread)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:8px 14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary small{opacity:.8;font-weight:500}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.82rem}

/* Ossature */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:16px}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail .grp>.eyebrow{padding:0 10px 4px}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.rail a:hover{background:var(--surface)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);max-width:62ch;margin-top:4px}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card>h3{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}

/* Scènes isométriques */
.scene-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.scene{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 80% at 30% 0%,var(--sky-bot),var(--sky-top));border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto;filter:brightness(var(--scene-dim))}
.scene .tag rect{fill:#FFFFFF;stroke:#17202E;stroke-opacity:.15}
.scene .tag text{font:600 11px var(--f-body);fill:#17202E}
.scene .tag.mine rect{fill:#2D4A9E;stroke:none}
.scene .tag.mine text{fill:#FFFFFF}
.scene .tag .tip{fill:#FFFFFF}
.scene .tag.mine .tip{fill:#2D4A9E}
.scene .sign{font:700 9px var(--f-body);letter-spacing:.06em;fill:#FFFFFF}
.bld{cursor:pointer;transition:filter .15s}
.bld:hover,.bld:focus-visible{filter:brightness(1.1) drop-shadow(0 0 6px rgba(255,255,255,.8));outline:none}
.bld.sel{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px rgba(45,74,158,.9))}
.item{cursor:pointer}
.item:hover,.item:focus-visible{filter:brightness(1.12);outline:none}
.item.sel{filter:drop-shadow(0 0 4px rgba(45,74,158,1))}
.tile{cursor:default}
.placing .tile{cursor:crosshair}
.scene-bar{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--thread-soft);color:var(--thread);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.panel{display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.86rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.meter{display:flex;flex-direction:column;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font-size:.82rem}
.meter .lab b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.th i{background:var(--thread)}
.bar.gd i{background:var(--good)}
.bar.bd i{background:var(--bad)}

.cat{display:flex;flex-direction:column;gap:6px}
.cat button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.cat button:hover{border-color:var(--accent)}
.cat button.on{border-color:var(--accent);background:var(--accent-soft)}
.cat button b{font-size:.88rem}
.cat button span{font-size:.76rem;color:var(--muted);grid-column:1/-1}
.cat button em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums;font-size:.85rem}

/* Encadrés pédagogiques */
.notion{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.notion .eyebrow{color:var(--accent)}
.notion p{font-size:.88rem}
.lv{border:1px dashed var(--thread);background:var(--thread-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lv .eyebrow{color:var(--thread)}
.lv p{font-size:.86rem}
.engine{font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.engine::before{content:"⚙";font-size:.85rem;line-height:1.2}

/* Écriture comptable */
.entry{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.entry .t{padding:7px 10px;border-bottom:1px solid var(--line);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.entry table{width:100%;border-collapse:collapse}
.entry td{padding:4px 10px;font-variant-numeric:tabular-nums}
.entry td.n{text-align:right;width:84px;white-space:nowrap}
.entry tr.cr td:first-child{padding-left:28px}
.entry th{font-weight:500;color:var(--muted);text-align:right;padding:4px 10px;font-size:.7rem}
.entry th:first-child{text-align:left}

/* Choix */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-family:var(--f-display);font-size:1rem}
.opt span{font-size:.8rem;color:var(--muted)}
.opt .price{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.opt[disabled]{opacity:.5;cursor:not-allowed}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600}
input[type=text],input[type=number],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.out{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.err{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:9px;font-size:.84rem;font-weight:500}
.ok{background:var(--good-soft);color:var(--good);padding:8px 12px;border-radius:9px;font-size:.84rem;font-weight:500}

/* Tableau de bord */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:.8rem;color:var(--muted)}
.bilan{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bilan>div{padding:10px 12px;display:flex;flex-direction:column}
.bilan>div:first-child{border-right:1px solid var(--line)}
.bilan .h{font-family:var(--f-display);font-weight:700;margin-bottom:4px}
.bilan .l{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;padding:3px 0}
.bilan .l b{font-variant-numeric:tabular-nums;font-weight:600}
.bilan .tot{margin-top:auto;border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.press{font-family:var(--f-display)}
.press .mast{font-size:1.25rem;font-weight:800;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.press .mast small{font-family:var(--f-body);font-weight:500;color:var(--muted)}
.press h4{font-size:1rem;margin-bottom:2px}
.press p{font-family:var(--f-body);font-size:.84rem;color:var(--muted);margin-bottom:10px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.alert i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.alert.bad i{background:var(--bad)} .alert.warn i{background:var(--thread)} .alert.good i{background:var(--good)}
.journal{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.chart text{font:11px var(--f-body);fill:var(--muted)}
.chart .gridl{stroke:var(--line)}
.chart .b{fill:var(--accent);opacity:.55}
.chart .b.last{opacity:1}
.chart .val{fill:var(--ink);font-weight:600}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2}
.spark path.a{fill:var(--accent);opacity:.12}
.spark circle{fill:var(--accent)}

table.rank{width:100%;border-collapse:collapse;font-size:.88rem}
table.rank th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.rank td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.rank td.r,table.rank th.r{text-align:right}
table.rank tr.me td{background:var(--accent-soft);font-weight:600}
.scroll-x{overflow-x:auto}
.mission{display:flex;flex-direction:column;gap:8px}
.mission .st{align-self:flex-start}

.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;font-size:.86rem;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.75rem;display:grid;place-items:center}

.lock{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--thread-soft);color:var(--thread);font-weight:500;font-size:.88rem}

#toast{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;flex-direction:column;gap:8px;max-width:min(400px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:pop .25s ease-out}
.toast.bad{border-color:var(--bad)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.86rem}

@media (max-width:1100px){.scene-grid{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:14px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail .grp{flex-direction:row;gap:2px}
  .rail .grp>.eyebrow{display:none}
  .rail a{white-space:nowrap}
  .split,.g3,.g2{grid-template-columns:1fr}
  .top{position:static}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.stat .mini{width:60px}h1{font-size:1.45rem}.bilan{grid-template-columns:1fr}.bilan>div:first-child{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><polygon points="17,3 31,10 17,17 3,10" fill="var(--accent)"/><polygon points="3,10 17,17 17,31 3,24" fill="var(--accent)" opacity=".7"/><polygon points="31,10 17,17 17,31 31,24" fill="var(--thread)"/></svg>
    <div><b>Kapital</b><small>Maquette V2 · données fictives, en euros</small></div>
  </div>
  <div class="stats" id="stats"></div>
  <button class="btn primary" data-act="close" id="closeBtn">Clôturer le mois <small>(demain 6 h)</small></button>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Écrans du jeu"></nav>
  <main id="view"></main>
</div>
<div id="toast" aria-live="polite"></div>

};

const r2=n=>Math.round(n*100)/100;
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const fmt2=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pct=n=>(n*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %';
const dateLabel=(t=S.t)=>`${MOIS[(t-1)%12]} an ${Math.floor((t-1)/12)+1}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function post(lib,lines){ lines=lines.map(l=>({a:l.a,d:l.d?r2(l.d):0,c:l.c?r2(l.c):0})); const e={t:S.t,lib,lines}; L.push(e); return e; }
function bal(p){let s=0;for(const e of L)for(const l of e.lines)if(l.a.startsWith(p))s+=l.d-l.c;return r2(s);}
function accName(a){return PCG[a]||PCG[a.slice(0,3)]||PCG[a.slice(0,2)]||a;}
function bilan(){
  const A={immo:bal('2'),stocks:bal('3'),clients:bal('41'),treso:bal('5')};
  const P={capital:-bal('10'),resultat:-(bal('6')+bal('7')),emprunts:-bal('16'),fourn:-bal('40')};
  A.total=A.immo+A.stocks+A.clients+A.treso; P.total=P.capital+P.resultat+P.emprunts+P.fourn;
  return {A,P};
}
const treso=()=>bal('512');
const capitauxPropres=()=>{const b=bilan();return b.P.capital+b.P.resultat;};
const nb=(t)=>S.atelier.filter(i=>i.t===t).length;
const poste=(p)=>S.employes.filter(e=>e.poste===p).length;
function capacite(){const m=nb('machine'),c=poste('Couturière');return Math.round(Math.min(m,c)*400*(1+.1*Math.min(2,nb('coupe'))));}
function stockage(){return 500+300*nb('etagere')+(S.localVillage?600:0);}
const stockTotal=()=>S.stock.tshirt+S.stock.chemise+S.stock.sac;
function amortMensuel(){
  let s=0; for(const i of S.atelier){const c=CAT[i.t]; if(c.amort) s+=c.prix/c.amort;}
  if(S.magasin) s+=18000/120;
  if(S.local.proprio) s+=S.local.prixBati/300;
  return r2(s);
}
function demand(p){
  const base={tshirt:1.6+S.notoriete/6,chemise:.15+S.notoriete/45,sac:.5+S.notoriete/16}[p];
  const e=Math.max(.6,2.2-S.desirabilite/40);
  let f=Math.pow(REF[p].prixRef/S.prix[p],e);
  f*=1+.12*poste('Vendeur');
  if(S.canal==='marketplace') f*=1.25;
  if(S.magasin) f*=S.magasin.boost;
  return base*f;
}
function mensualite(c,taux,n){const r=taux/100/12;return r===0?c/n:c*r/(1-Math.pow(1+r,-n));}
const ESTR=1.90;
function margeBanque(){const cp=capitauxPropres();const det=-bal('16');const ratio=cp>0?det/cp:9;return r2(1.8+Math.min(2.5,ratio*.4));}

/* ============ Actions (toutes passent une écriture) ============ */
function act_produce(p,mode,q,silent){
  q=Math.max(0,Math.round(q)); if(!q) return fail('Indique une quantité.');
  const R=REF[p];
  if(stockTotal()+q>stockage()) return fail(`Pas assez de place : stockage ${fmt0(stockTotal())} sur ${fmt0(stockage())} pièces. Ajoute une étagère ou loue un local.`);
  let e;
  if(mode==='atelier'){
    const need=q*R.charge, libre=capacite()-S.prodMois;
    if(need>libre) return fail(`Capacité insuffisante : il reste ${fmt0(libre)} unités ce mois-ci. Il faut plus de machines et de couturières.`);
    const cost=q*R.matiere; if(cost>treso()) return fail('Trésorerie insuffisante pour acheter le tissu.');
    S.prodMois+=need;
    e=post(`Tissu pour ${q} ${R.pl} (atelier)`,[{a:'601',d:cost},{a:'512',c:cost}]);
  } else {
    const cost=q*R.facon;
    e=post(`${q} ${R.pl} chez Façonnier Duval (à 30 jours)`,[{a:'604',d:cost},{a:'401',c:cost}]);
  }
  S.stock[p]+=q; if(!silent) toast(`${q} ${R.pl} en stock.`,e); return true;
}
const fmt0=n=>(Math.round(n)||0).toLocaleString('fr-FR');
function act_campaign(id,silent){
  const c=CAMPAGNES.find(x=>x.id===id); if(c.prix>treso()) return fail('Trésorerie insuffisante pour cette campagne.');
  const e=post(`Campagne : ${c.nom}`,[{a:'623',d:c.prix},{a:'512',c:c.prix}]);
  S.notoriete=Math.min(100,S.notoriete+c.no); S.desirabilite=Math.min(100,S.desirabilite+c.de);
  if(!silent) toast(`Campagne lancée. Notoriété +${c.no}, désirabilité +${c.de}.`,e); return true;
}
function act_hire(id,contrat,silent){
  const c=CANDIDATS.find(x=>x.id===id);
  if(c.needs==='bureau' && nb('bureau')*1 <= S.employes.filter(e=>e.needs==='bureau').length) return fail('Il faut d’abord placer un bureau libre dans l’atelier.');
  S.employes.push({...c,contrat}); if(!silent) toast(`${c.nom} rejoint l’équipe (${contrat}). Premier salaire à la clôture.`); return true;
}
function act_place(t,x,y){
  const c=CAT[t]; if(c.prix>treso()) return fail('Trésorerie insuffisante.');
  if(t==='coupe'&&nb('coupe')>=2) return fail('Deux tables de coupe au maximum.');
  S.atelier.push({t,x,y});
  const e=post(`Achat : ${c.nom}`,[{a:c.compte,d:c.prix},{a:'512',c:c.prix}]);
  if(t==='presse') S.desirabilite+=2;
  toast(`${c.nom} installée.`,e); return true;
}
function act_loan(m,d,silent){
  const taux=r2(ESTR+margeBanque()), mens=mensualite(m,taux,d);
  S.prets.push({lib:`Prêt ${fmt(m)} sur ${d} mois`,capital:m,restant:m,taux,duree:d,mensualite:mens});
  const e=post(`Prêt Banque du Quai à ${taux.toLocaleString('fr-FR')} %`,[{a:'512',d:m},{a:'164',c:m}]);
  if(!silent) toast('Prêt signé. Les fonds sont sur ton compte.',e); return true;
}
function closeMonth(forced,silent){
  const t=S.t; let units={tshirt:0,chemise:0,sac:0}, ca=0;
  for(const p in REF){
    const q=forced? Math.min(S.stock[p],forced[p]||0) : Math.min(S.stock[p],Math.round(demand(p)*30*(.9+Math.random()*.2)));
    S.stock[p]-=q; units[p]=q; ca+=q*S.prix[p];
  }
  if(ca>0){ post('Ventes en ligne du mois',[{a:'512',d:ca},{a:'701',c:ca}]);
    const com=S.canal==='marketplace'?ca*.15:49+ca*.02;
    post(S.canal==='marketplace'?'Commission de la place de marché (15 %)':'Boutique en ligne : abonnement et 2 %',[{a:'622',d:com},{a:'512',c:com}]); }
  let caRev=0;
  for(const r of REV) if(S.revendeurs[r.id]){ const q=Math.min(S.stock.tshirt,r.qte); if(!q) continue; S.stock.tshirt-=q; units.tshirt+=q; const v=q*S.prix.tshirt*.5; caRev+=v; S.creances.push({due:t+2,amt:v}); }
  if(caRev>0) post('Ventes aux revendeurs, payées à 60 jours',[{a:'411',d:caRev},{a:'701',c:caRev}]);
  const due=S.creances.filter(c=>c.due<=t); S.creances=S.creances.filter(c=>c.due>t);
  const enc=due.reduce((s,c)=>s+c.amt,0); if(enc>0) post('Encaissement des revendeurs',[{a:'512',d:enc},{a:'411',c:enc}]);
  const f=-bal('401'); if(f>0) post('Paiement des fournisseurs',[{a:'401',d:f},{a:'512',c:f}]);
  if(!S.local.proprio) post(`Loyer : ${S.local.nom}`,[{a:'613',d:S.local.loyer},{a:'512',c:S.local.loyer}]);
  if(S.localVillage) post('Loyer du local du village',[{a:'613',d:420},{a:'512',c:420}]);
  if(S.magasin) post('Loyer du magasin',[{a:'613',d:S.magasin.loyer},{a:'512',c:S.magasin.loyer}]);
  const brut=S.employes.reduce((s,e)=>s+e.brut,0);
  if(brut) post('Salaires et charges sociales',[{a:'641',d:brut},{a:'645',d:brut*.42},{a:'512',c:brut*1.42}]);
  for(const p of S.prets) if(p.restant>.5){ const i=p.restant*p.taux/100/12, cap=Math.min(p.restant,p.mensualite-i); p.restant-=cap; post(`Échéance : ${p.lib}`,[{a:'164',d:cap},{a:'661',d:i},{a:'512',c:cap+i}]); }
  const dot=amortMensuel(); if(dot>0) post('Dotation aux amortissements',[{a:'681',d:dot},{a:'28',c:dot}]);
  let res=0; for(const e of L) if(e.t===t) for(const l of e.lines){ if(l.a[0]==='7') res+=l.c-l.d; if(l.a[0]==='6') res-=l.d-l.c; }
  const tot=units.tshirt+units.chemise+units.sac;
  S.vendusT+=units.tshirt;
  S.hist.push({t,ca:r2(ca+caRev),units:tot,tshirt:units.tshirt,res:r2(res)});
  S.notoriete=Math.max(0,Math.min(100,S.notoriete-1+1.5*poste('Community manager')+Math.min(2,tot/150)));
  S.desirabilite=Math.max(0,S.desirabilite-.5);
  S.treso.push(treso());
  makePress(t,units,res);
  S.t++; S.prodMois=0;
  checkMissions();
  if(!silent){ render(); toast(`${dateLabel(t)} clôturé : ${units.tshirt} t-shirts, ${units.chemise} chemises et ${units.sac} sacs vendus. Résultat du mois ${res>=0?'+':''}${fmt(res)}.`); }
}
function makePress(t,u,res){
  const pnj=PNJ[Math.floor(Math.random()*3)];
  const items=[
    {h:`Maison Lumen écoule ${u.tshirt} t-shirts en ${MOIS[(t-1)%12]}`,p:res>=0?'La jeune SAS dégage son premier bénéfice mensuel. Les banquiers du quai sourient.':'Les ventes progressent, mais les charges fixes pèsent encore sur le résultat.'},
    {h:`${pnj.nom} baisse ses prix de 5 %`,p:'La concurrence se durcit sur le t-shirt basique. Les marques désirables résistent mieux.'},
    {h:'L’€STR stable à 1,90 %',p:'Le coût du crédit ne bouge pas. Bonne nouvelle pour les entreprises qui empruntent.'}
  ];
  S.presse=items;
}
function checkMissions(){
  const done=(k,msg)=>{ if(!S.missionsOk[k]){ S.missionsOk[k]=true; S.notoriete=Math.min(100,S.notoriete+5); if(UI.ready) toast(`Mission réussie : ${msg}. Notoriété +5.`);} };
  if(S.vendusT>=100) done('ventes','100 t-shirts vendus');
  if(S.hist.some(h=>h.res>0)) done('rentable','premier mois rentable');
  if(S.magasin) done('magasin','pignon sur rue');
}

/* ============ Isométrie réaliste ============ */
const TW=64,TH=32,TZ=32;
const iso=(x,y,z=0)=>[(x-y)*TW/2,(x+y)*TH/2-z*TZ];
const pt=(x,y,z)=>{const p=iso(x,y,z);return p[0].toFixed(1)+','+p[1].toFixed(1);};
const poly=(pts,fill,attr='')=>`<polygon points="${pts.map(a=>pt(a[0],a[1],a[2]||0)).join(' ')}" fill="${fill}" ${attr}/>`;
const seg=(a,b,stroke,w=1,attr='')=>{const p=iso(a[0],a[1],a[2]||0),q=iso(b[0],b[1],b[2]||0);return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" ${attr}/>`;};
function shade(hex,f){const n=parseInt(hex.slice(1),16);const ch=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f))));return '#'+ch.map(v=>v.toString(16).padStart(2,'0')).join('');}
const edge=c=>`stroke="${shade(c,.6)}" stroke-width=".5" stroke-linejoin="round"`;
function face(pts,col,tex,ao=true){return poly(pts,col,edge(col))+(tex?poly(pts,`url(#${tex})`):'')+(ao?poly(pts,'url(#ao)'):'');}
function box(x,y,w,d,h,col,z=0,o={}){
  const t=z+h, top=[[x,y,t],[x+w,y,t],[x+w,y+d,t],[x,y+d,t]];
  return face([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,t],[x,y+d,t]],shade(col,.9),o.tl,o.ao!==false)
   + face([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,t],[x+w,y,t]],shade(col,.7),o.tr,o.ao!==false)
   + poly(top,shade(col,1.06),edge(col)) + (o.tt?poly(top,`url(#${o.tt})`):'');
}
const FL=(x,Y)=>(u,v)=>[x+u,Y,v];
const FR=(X,y)=>(u,v)=>[X,y+u,v];
const quad=(f,u0,u1,v0,v1)=>[f(u0,v0),f(u1,v0),f(u1,v1),f(u0,v1)];
function win(f,u0,u1,v0,v1,o={}){
  const fr=o.frame||'#F4F1EA', m=o.m??.035;
  let s=poly(quad(f,u0-m,u1+m,v0-m,v1+m),fr,`stroke="${shade(fr,.55)}" stroke-width=".5"`);
  s+=poly(quad(f,u0,u1,v0,v1),o.warm?'url(#glassWarm)':'url(#glass)');
  if(o.curtain) s+=poly(quad(f,u0,u0+(u1-u0)*.22,v0,v1),'rgba(245,236,220,.85)')+poly(quad(f,u1-(u1-u0)*.22,u1,v0,v1),'rgba(245,236,220,.85)');
  const cols=o.cols??2, rows=o.rows??1;
  for(let i=1;i<cols;i++){const u=u0+(u1-u0)*i/cols;s+=seg(f(u,v0),f(u,v1),fr,o.mw||1.1);}
  for(let j=1;j<rows;j++){const v=v0+(v1-v0)*j/rows;s+=seg(f(u0,v),f(u1,v),fr,o.mw||1.1);}
  if(o.sill!==false) s+=poly(quad(f,u0-.06,u1+.06,v0-.075,v0-.035),shade(fr,.78));
  return s;
}
function textOn(f,u,v,txt,size,fill,dir){const [px,py]=iso(...f(u,v));return `<text class="sign" text-anchor="middle" transform="translate(${px.toFixed(1)},${py.toFixed(1)}) skewY(${dir==='R'?-26.565:26.565})" style="font-size:${size}px;fill:${fill}">${txt}</text>`;}

function spark(arr,w=220,h=46){

}

   <div id="asvg">${atelierSVG()}</div></div>
  <aside class="panel">
   <div class="card panel"><h3>Production</h3>
    ${meter('Capacité ce mois',Math.max(0,cap-S.prodMois),Math.max(cap,1),'',`${fmt0(Math.max(0,cap-S.prodMois))} / ${fmt0(cap)} unités`)}
    ${meter('Machines utilisées',Math.min(m,c),Math.max(m,1),'th',`${Math.min(m,c)} / ${m}`)}
    ${meter('Stockage',stockTotal(),stockage(),stockTotal()>stockage()*.85?'bd':'gd',`${fmt0(stockTotal())} / ${fmt0(stockage())} pièces`)}
    ${alerts.length?`<div class="alerts">${alerts.join('')}</div>`:''}
   </div>
   ${sel?`<div class="card"><span class="eyebrow">Objet sélectionné</span><h3 style="margin:2px 0 6px">${esc(CAT[sel.t].nom)}</h3><p style="font-size:.88rem">${CAT[sel.t].effet}</p>${CAT[sel.t].prix?`<dl class="facts" style="margin-top:10px"><dt>Prix d’achat</dt><dd>${fmt(CAT[sel.t].prix)}</dd>${CAT[sel.t].amort?`<dt>Amorti sur</dt><dd>${CAT[sel.t].amort/12} ans</dd><dt>Charge par mois</dt><dd>${fmt2(CAT[sel.t].prix/CAT[sel.t].amort)}</dd>`:''}</dl>`:''}</div>`:''}
   <div class="card"><h3>Acheter et placer</h3><div class="cat">${Object.entries(CAT).filter(([,c])=>!c.deco).map(([k,c])=>`<button class="${UI.place===k?'on':''}" data-place="${k}"><b>${c.nom}</b><em>${fmt(c.prix)}</em><span>${c.effet}</span></button>`).join('')}</div></div>
   ${notion('Une machine n’est pas une dépense comme les autres','Une machine sert plusieurs années. Elle va à l’actif du bilan (immobilisation), puis perd un peu de valeur chaque mois : c’est l’amortissement, une charge qui ne sort pas de la trésorerie.')}
   ${lv('Dès 1859, Louis Vuitton installe ses ateliers à Asnières. Fabriquer soi-même permet de contrôler la qualité, au prix de coûts fixes à payer chaque mois.')}

V.tableau=()=>{
  const b=bilan(), last=S.hist.at(-1), prev=S.hist.at(-2);
  const dj=demand('tshirt');
  const charges=(S.local.proprio?0:S.local.loyer)+S.employes.reduce((s,e)=>s+e.brut*1.42,0)+S.prets.reduce((s,p)=>s+(p.restant>0?p.mensualite:0),0)+(S.magasin?S.magasin.loyer:0);
  const mois=charges>0?treso()/charges:99;
  const al=[];
  if(mois<3) al.push(['bad',`Ta trésorerie couvre ${mois.toLocaleString('fr-FR',{maximumFractionDigits:1})} mois de charges fixes. Attention.`]);
  else al.push(['good',`Ta trésorerie couvre ${Math.floor(mois)} mois de charges fixes (${fmt(charges)} par mois).`]);
  if(nb('machine')>poste('Couturière')) al.push(['warn','Une machine attend une couturière : capacité perdue.']);
  for(const p in REF){const d=demand(p)*30; const j=d>0?S.stock[p]/d*30:99; if(j<20) al.push(['warn',`Stock de ${REF[p].pl} : environ ${Math.max(0,Math.round(j))} jours de ventes. Relance la production.`]);}
  if(last&&last.res<0) al.push(['warn',`Résultat de ${MOIS[(last.t-1)%12]} : ${fmt(last.res)}. Les ventes ne couvrent pas encore les charges fixes.`]);
  const recent=L.slice(-7).reverse();
  return `<div class="head"><div><span class="eyebrow">Maison Lumen · SAS · ${dateLabel()}</span><h1>Tableau de bord</h1><p>Ce que voit un dirigeant chaque matin : la trésorerie, les ventes, la marque et le bilan.</p></div><div class="row"><a class="btn" href="#village">← Village</a></div></div>
  <div class="grid g4">
   <div class="card kpi"><span class="eyebrow">Trésorerie</span><span class="v">${fmt(treso())}</span>${spark(S.treso)}<span class="d">Compte 512 Banque, fin de chaque mois</span></div>
   <div class="card kpi"><span class="eyebrow">Ventes du jour</span><span class="v">${dj.toLocaleString('fr-FR',{maximumFractionDigits:1})} <small class="muted">t-shirts</small></span><span class="d">Soit environ ${fmt0(dj*30)} ce mois-ci. Monte avec la notoriété, les salariés et les investissements.</span></div>
   <div class="card kpi"><span class="eyebrow">Notoriété</span><span class="v">${Math.round(S.notoriete)} <small class="muted">/ 100</small></span><div class="bar"><i style="width:${S.notoriete}%"></i></div><span class="d">Combien de gens connaissent ta marque. Elle fait le volume.</span></div>
   <div class="card kpi"><span class="eyebrow">Désirabilité</span><span class="v">${Math.round(S.desirabilite)} <small class="muted">/ 100</small></span><div class="bar th"><i style="width:${S.desirabilite}%"></i></div><span class="d">Combien ils en ont envie. Elle permet de vendre plus cher.</span></div>
  </div>
  <div class="split">
   <div class="card"><h3>Chiffre d’affaires par mois de jeu</h3>${barChart()}<p class="muted" style="font-size:.8rem;margin-top:6px">${last?`${MOIS[(last.t-1)%12]} : ${last.units} pièces vendues${prev&&prev.ca?`, ${last.ca>=prev.ca?'+':''}${pct((last.ca-prev.ca)/prev.ca)} par rapport au mois précédent`:''}.`:''}</p></div>
   <div class="card"><h3>Bilan simplifié</h3>
    <div class="bilan"><div><span class="h">Actif</span><span class="eyebrow" style="margin-bottom:4px">Ce que la société possède</span>
     <div class="l"><span>Immobilisations nettes</span><b>${fmt0(b.A.immo)}</b></div><div class="l"><span>Stock de tissu</span><b>${fmt0(b.A.stocks)}</b></div><div class="l"><span>Créances clients</span><b>${fmt0(b.A.clients)}</b></div><div class="l"><span>Trésorerie</span><b>${fmt0(b.A.treso)}</b></div>
     <div class="l tot"><span>Total</span><b>${fmt0(b.A.total)}</b></div></div>
    <div><span class="h">Passif</span><span class="eyebrow" style="margin-bottom:4px">Qui l’a financé</span>
     <div class="l"><span>Capital</span><b>${fmt0(b.P.capital)}</b></div><div class="l"><span>Résultat de l’exercice</span><b class="${b.P.resultat<0?'neg':'pos'}">${fmt0(b.P.resultat)}</b></div><div class="l"><span>Emprunts</span><b>${fmt0(b.P.emprunts)}</b></div><div class="l"><span>Fournisseurs</span><b>${fmt0(b.P.fourn)}</b></div>
     <div class="l tot"><span>Total</span><b>${fmt0(b.P.total)}</b></div></div></div>
    <p class="${Math.abs(b.A.total-b.P.total)<1?'ok':'err'}" style="margin-top:10px">Actif = Passif : ${Math.abs(b.A.total-b.P.total)<1?'le bilan est équilibré.':'écart !'} Chaque écriture a toujours un débit et un crédit égaux.</p>
   </div>
  </div>
  <div class="grid g3">
   <div class="card"><h3>Le moteur te signale</h3><div class="alerts">${al.map(([c,t])=>`<div class="alert ${c}"><i></i><span>${t}</span></div>`).join('')}</div></div>
   <div class="card"><h3>Dernières écritures</h3><div class="journal">${recent.map(e=>entryHTML(e.lib,e.lines,MOIS[(e.t-1)%12].slice(0,4)+'.')).join('')}</div></div>
   <div class="card press"><div class="mast"><span>Le Petit Kapital</span><small>Revue de presse</small></div>${S.presse.map(p=>`<h4>${esc(p.h)}</h4><p>${esc(p.p)}</p>`).join('')}${engine('Rédigée par l’IA. Les chiffres viennent du moteur.')}</div>
  </div>
  ${notion('Trésorerie et résultat ne disent pas la même chose','Le résultat compare ce que tu as gagné à ce que tu as consommé. La trésorerie, c’est l’argent sur le compte. Tu peux être en perte avec une trésorerie confortable (grâce au prêt), ou rentable et à court d’argent (si tes clients paient tard).')}`;
};

V.societe=()=>{
  const u=UI.soc, F=FORMES[u.forme];
  const errs=[];
  if(!u.nom.trim()) errs.push('Donne un nom à la société.');
  if(u.capital<F.capMin) errs.push(`Une ${u.forme} exige un capital d’au moins ${fmt0(F.capMin)}.`);
  if(u.associes<F.aMin) errs.push(`Une ${u.forme} exige au moins ${F.aMin} associés.`);
  if(u.associes>F.aMax) errs.push(`Une ${u.forme} accepte au maximum ${F.aMax} associés.`);
  if(u.objet==='commerce'&&!F.commerce) errs.push('Une SCI est une société civile : elle ne peut pas vendre de vêtements. Choisis une activité immobilière ou une autre forme.');
  if(u.capital>S.perso) errs.push(`Ton patrimoine personnel (${fmt(S.perso)}) ne suffit pas pour ce capital.`);
  return `<div class="head"><div><span class="eyebrow">Greffe du tribunal de commerce</span><h1>Société</h1><p>Ta société principale existe déjà. Tu peux en créer d’autres : une SCI pour acheter les murs, plus tard une holding pour un groupe.</p></div></div>
  <div class="grid g2">${S.societes.map(s=>`<div class="card"><span class="eyebrow">${s.principale?'Ta société principale':'Autre société'}</span><h2 style="margin:2px 0 8px">${esc(s.nom)} <span class="chip acc">${s.forme}</span></h2><dl class="facts"><dt>Capital</dt><dd>${fmt(s.capital)}</dd><dt>Associés</dt><dd>${s.associes}</dd><dt>Activité</dt><dd>${esc(s.objet)}</dd><dt>Dirigeant</dt><dd>${esc(FORMES[s.forme].dir)}</dd></dl></div>`).join('')}</div>
  <div class="split">
   <div class="card panel"><h3>Créer une nouvelle société</h3>
    <div class="opts">${Object.entries(FORMES).map(([k,f])=>`<button class="opt ${u.forme===k?'on':''}" data-set="soc.forme:${k}"><b>${k}</b><span>${f.long}</span><span class="price">Capital min. ${fmt0(f.capMin)}</span></button>`).join('')}</div>
    <div class="grid g2"><label class="f" for="s-nom">Nom<input id="s-nom" type="text" data-k="soc.nom" value="${esc(u.nom)}"></label>
     <label class="f" for="s-obj">Activité (objet social)<select id="s-obj" data-k="soc.objet"><option value="immo" ${u.objet==='immo'?'selected':''}>Acheter et louer des immeubles</option><option value="commerce" ${u.objet==='commerce'?'selected':''}>Créer et vendre des vêtements</option><option value="holding" ${u.objet==='holding'?'selected':''}>Détenir des parts d’autres sociétés</option></select></label>
     <label class="f" for="s-cap">Capital apporté<input id="s-cap" type="number" min="1" step="100" data-k="soc.capital" value="${u.capital}"></label>
     <label class="f" for="s-as">Nombre d’associés<input id="s-as" type="number" min="1" data-k="soc.associes" value="${u.associes}"></label></div>
    <div id="socsum">${socSum(errs,F)}</div>
   </div>
   <div class="panel"><div class="card"><h3>Les étapes, comme en vrai</h3><ol class="steps"><li>Rédiger les statuts : nom, objet, capital, pouvoirs du dirigeant.</li><li>Déposer le capital à la banque, chez un notaire ou à la Caisse des dépôts.</li><li>Publier une annonce légale.</li><li>Déposer le dossier sur le guichet unique (INPI).</li><li>Recevoir l’extrait Kbis : la société existe.</li></ol></div>
    ${notion('Le choix de la forme engage','La forme fixe la responsabilité des associés, le statut social du dirigeant et la souplesse des règles. La société est une personne distincte de toi : son argent n’est pas le tien.')}
    ${lv('Louis Vuitton fonde sa maison à Paris en 1854. En 1987, elle fusionne avec Moët Hennessy pour former LVMH, un groupe de sociétés. Tu commences comme lui : une seule maison.')}</div>
  </div>`;
};
function socSum(errs,F){
  const u=UI.soc;
  return `<dl class="facts" style="margin:4px 0 10px"><dt>Responsabilité</dt><dd>${F.resp}</dd><dt>Dirigeant</dt><dd>${F.dir}</dd></dl><p class="muted" style="font-size:.84rem;margin-bottom:10px">${F.note}</p>
  ${errs.length?errs.map(e=>`<p class="err" style="margin-bottom:6px">${e}</p>`).join(''):`${entryHTML(`Bilan d’ouverture de ${u.nom}`,[{a:'512',d:u.capital},{a:'101',c:u.capital}],'nouvelle société')}`}
  <div class="row" style="margin-top:10px"><button class="btn primary" data-act="createsoc" ${errs.length?'disabled':''}>Déposer les statuts</button><span class="muted" style="font-size:.8rem">Apport pris sur ton patrimoine personnel : ${fmt(S.perso)}</span></div>`;
}

V.production=()=>`<div class="head"><div><span class="eyebrow">Fabrication</span><h1>Production</h1><p>Fabrique dans ton atelier ou confie la production au façonnier. Les deux choix n’ont ni le même coût, ni le même effet sur ta trésorerie.</p></div></div>
  <div class="split"><div class="card panel">
   <h3>Quoi ?</h3><div class="opts">${Object.entries(REF).map(([k,r])=>`<button class="opt ${UI.prod.p===k?'on':''}" data-set="prod.p:${k}"><b>${r.nom}</b><span>Prix de vente actuel ${fmt(S.prix[k])}</span><span>En stock : ${fmt0(S.stock[k])}</span></button>`).join('')}</div>
   <h3>Où ?</h3><div class="opts">
    <button class="opt ${UI.prod.mode==='atelier'?'on':''}" data-set="prod.mode:atelier"><b>Ton atelier</b><span>Tu paies le tissu tout de suite. La main-d’œuvre, ce sont tes salaires, déjà payés.</span></button>
    <button class="opt ${UI.prod.mode==='faconnier'?'on':''}" data-set="prod.mode:faconnier"><b>Façonnier Duval</b><span>Prix tout compris par pièce, payé à 30 jours. Aucune capacité nécessaire.</span></button></div>
   <label class="f" for="p-q">Quantité : <span id="pq">${UI.prod.q}</span><input id="p-q" type="range" min="10" max="500" step="10" data-k="prod.q" value="${UI.prod.q}"></label>
   <div id="prodsum">${prodSum()}</div>
  </div><div class="panel">
   ${notion('Coût variable, coût fixe','Chez le façonnier, tout est variable : tu paies chaque pièce. En atelier, le salaire et le loyer tombent chaque mois, que tu produises ou non. L’atelier devient rentable quand il tourne à pleine capacité.')}
   ${notion('Le BFR (besoin en fonds de roulement)','Tu paies la production avant de vendre. Cet argent immobilisé dans le stock, c’est ton BFR. Le délai de 30 jours du façonnier le réduit : il finance ton stock un mois.')}
   ${lv('Louis Vuitton a toujours gardé une grande partie de sa fabrication dans ses propres ateliers. C’est un choix de qualité et de désirabilité, pas le moins cher.')}
  </div></div>`;
function prodSum(){
  const {p,mode,q}=UI.prod, R=REF[p];
  const mo=poste('Couturière')?(S.employes.filter(e=>e.poste==='Couturière').reduce((s,e)=>s+e.brut*1.42,0)/Math.max(1,capacite()))*R.charge:0;
  const unitCash=mode==='atelier'?R.matiere:R.facon, unitFull=mode==='atelier'?R.matiere+mo:R.facon;
  const marge=S.prix[p]-unitFull, taux=marge/S.prix[p];
  const lines=mode==='atelier'?[{a:'601',d:q*R.matiere},{a:'512',c:q*R.matiere}]:[{a:'604',d:q*R.facon},{a:'401',c:q*R.facon}];
  const libre=capacite()-S.prodMois;
  return `<div class="grid g2"><div><div class="kv"><span>Coût payé par pièce</span><b>${fmt2(unitCash)}</b></div>${mode==='atelier'?`<div class="kv"><span>Dont main-d’œuvre à pleine capacité</span><b>${fmt2(mo)}</b></div>`:''}<div class="kv"><span>Coût complet par pièce</span><b>${fmt2(unitFull)}</b></div><div class="kv"><span>Coût total</span><b>${fmt(q*unitCash)}</b></div></div>
   <div><div class="kv"><span>Marge par pièce</span><b class="${marge<0?'neg':'pos'}">${fmt2(marge)}</b></div><div class="kv"><span>Taux de marge</span><b>${pct(taux)}</b></div><div class="kv"><span>${mode==='atelier'?'Capacité restante':'Délai'}</span><b>${mode==='atelier'?fmt0(libre)+' unités':'1 mois'}</b></div><div class="kv"><span>Sortie de trésorerie</span><b>${mode==='atelier'?'immédiate':'dans 30 jours'}</b></div></div></div>
   <div style="margin-top:12px">${entryHTML(mode==='atelier'?'Achat du tissu':'Facture du façonnier',lines,'aperçu')}</div>
   <div class="row" style="margin-top:12px"><button class="btn primary" data-act="produce">Lancer la production</button>${engine('Coûts et délais : chiffres de la maquette. Le moteur les prendra dans le référentiel des coûts.')}</div>`;
}

V.banque=()=>{
  const u=UI.bk; const taux=r2(ESTR+margeBanque()); const mens=mensualite(u.m,taux,u.d);
  const cp=capitauxPropres(), dette=-bal('16'), ratio=cp>0?(dette+u.m)/cp:Infinity;
  let rows='', rest=u.m;
  for(let i=1;i<=u.d;i++){const it=rest*taux/100/12, ca=mens-it; rest-=ca; if(i<=3||i===u.d) rows+=`<tr><td>${i}</td><td class="r">${fmt2(mens)}</td><td class="r">${fmt2(it)}</td><td class="r">${fmt2(ca)}</td><td class="r">${fmt(Math.max(0,rest))}</td></tr>`; if(i===3&&u.d>4) rows+='<tr><td colspan="5" class="muted">…</td></tr>';}
  const re=.08;
  return `<div class="head"><div><span class="eyebrow">Banque du Quai</span><h1>Banque et prêt</h1><p>Emprunter permet d’investir sans attendre. La banque regarde ta solidité : plus tu es endetté, plus sa marge monte.</p></div></div>
  <div class="split"><div class="card panel"><h3>Simuler un prêt professionnel</h3>
   <label class="f" for="b-m">Montant : <span id="bm">${fmt(u.m)}</span><input id="b-m" type="range" min="5000" max="60000" step="1000" data-k="bk.m" value="${u.m}"></label>
   <label class="f" for="b-d">Durée<select id="b-d" data-k="bk.d">${[24,36,48,60].map(d=>`<option value="${d}" ${u.d==d?'selected':''}>${d} mois (${d/12} ans)</option>`).join('')}</select></label>
   <div class="grid g3"><div><span class="eyebrow">Taux</span><div class="out">${taux.toLocaleString('fr-FR')} %</div><span class="muted" style="font-size:.78rem">€STR ${ESTR.toLocaleString('fr-FR')} % + marge ${margeBanque().toLocaleString('fr-FR')} %</span></div>
    <div><span class="eyebrow">Mensualité</span><div class="out">${fmt(mens)}</div></div><div><span class="eyebrow">Coût total du crédit</span><div class="out">${fmt(mens*u.d-u.m)}</div></div></div>
   <div class="scroll-x"><table class="rank"><tr><th>Échéance</th><th class="r">Mensualité</th><th class="r">Intérêts</th><th class="r">Capital</th><th class="r">Restant dû</th></tr>${rows}</table></div>
   ${ratio>3?`<p class="err">Endettement après ce prêt : ${ratio.toLocaleString('fr-FR',{maximumFractionDigits:1})} fois tes capitaux propres. La banque exigera ta caution personnelle.</p>`:`<p class="ok">Endettement après ce prêt : ${ratio.toLocaleString('fr-FR',{maximumFractionDigits:1})} fois tes capitaux propres.</p>`}
   ${entryHTML('Déblocage du prêt',[{a:'512',d:u.m},{a:'164',c:u.m}],'aperçu')}
   <div class="row"><button class="btn primary" data-act="loan">Signer l’offre de prêt</button>${engine('Le taux réel suivra l’€STR publié chaque jour par la BCE. Ici, valeur de démonstration.')}</div>
  </div><div class="panel">
   <div class="card"><h3>Tes prêts en cours</h3>${S.prets.map(p=>`<div class="kv"><span>${esc(p.lib)} à ${p.taux.toLocaleString('fr-FR')} %</span><b>${fmt(p.restant)} restants</b></div>`).join('')||'<p class="muted">Aucun prêt.</p>'}</div>
   ${notion('L’effet de levier','Si ton activité rapporte plus que ce que coûte la dette, emprunter augmente la rentabilité de tes capitaux propres. Exemple : un investissement qui rapporte '+pct(re)+' financé à '+taux.toLocaleString('fr-FR')+' %, avec autant de dette que de capitaux propres, rapporte '+pct(re+(re-taux/100))+' aux associés. Si l’activité rapporte moins que le taux, le levier joue à l’envers.')}

function toast(msg,entry,bad){
  const t=document.createElement('div'); t.className='toast'+(bad?' bad':'');
  t.innerHTML=`<b style="font-size:.9rem">${esc(msg)}</b>${entry?entryHTML(entry.lib,entry.lines,'écriture passée'):''}`;
  const box=document.getElementById('toast'); box.prepend(t); while(box.children.length>3) box.lastChild.remove();
  setTimeout(()=>t.remove(),entry?7000:5000);
}
function fail(m){ if(UI.ready) toast(m,null,true); return false; }

function setPath(path,val){ const ks=path.split('.'); let o=ks[0]==='prix'||ks[0]==='canal'?S:UI; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks.at(-1)]=val; }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-set],[data-place],[data-hire],[data-rev],[data-b],[data-item],.tile'); if(!t) return;
  if(t.dataset.set){ const [k,v]=t.dataset.set.split(':'); setPath(k,v); render(); return; }
  if(t.dataset.place){ UI.place=UI.place===t.dataset.place?null:t.dataset.place; UI.isel=null; render(); return; }
  if(t.dataset.hire){ if(act_hire(t.dataset.hire,UI.emb.contrat)) render(); return; }
  if(t.dataset.rev){ S.revendeurs[t.dataset.rev]=!S.revendeurs[t.dataset.rev]; toast(S.revendeurs[t.dataset.rev]?'Contrat revendeur signé. Livraisons à chaque clôture.':'Contrat revendeur arrêté.'); render(); return; }
  if(t.dataset.b){ UI.vsel=t.dataset.b; render(); return; }
  if(t.dataset.item!==undefined && !UI.place){ UI.isel=+t.dataset.item; render(); return; }
  if(t.classList&&t.classList.contains('tile')){ if(UI.place){ const x=+t.dataset.x,y=+t.dataset.y; if(!fits(UI.place,x,y,occupancy())) return fail('Cette place est occupée ou trop petite.'); if(act_place(UI.place,x,y)){UI.place=null;UI.hover=null;UI.isel=S.atelier.length-1;} render(); } else { UI.isel=null; render(); } return; }
  const a=t.dataset.act;
  if(a==='close') closeMonth();
  else if(a==='cancelplace'){UI.place=null;UI.hover=null;render();}
  else if(a==='produce'){ if(act_produce(UI.prod.p,UI.prod.mode,+UI.prod.q)) render(); }
  else if(a==='campaign'){ if(act_campaign(UI.mk.c)) render(); }
  else if(a==='loan'){ act_loan(+UI.bk.m,+UI.bk.d); render(); }
  else if(a==='createsoc'){ const u=UI.soc; S.perso-=+u.capital; S.societes.push({nom:u.nom,forme:u.forme,capital:+u.capital,associes:+u.associes,objet:{immo:'Acheter et louer des immeubles',commerce:'Créer et vendre des vêtements',holding:'Détenir des parts d’autres sociétés'}[u.objet]}); toast(`${u.nom} est immatriculée. Elle a son propre bilan : Banque ${fmt0(u.capital)} = Capital ${fmt0(u.capital)}.`); UI.soc={forme:'SAS',nom:'',capital:1000,associes:1,objet:'holding'}; render(); }
  else if(a==='localvillage'){ if(840>treso()) return fail('Trésorerie insuffisante.'); S.localVillage=true; const en=post('Dépôt de garantie, local du village',[{a:'275',d:840},{a:'512',c:840}]); toast('Local loué : +600 pièces de stockage.',en); render(); }
  else if(a==='loft'){ if(1500>treso()) return fail('Trésorerie insuffisante.'); S.local={id:'loft',nom:'Loft quai des Teinturiers',m2:200,loyer:1300,W:13,D:9,proprio:false}; const en=post('Frais de déménagement',[{a:'613',d:1500},{a:'512',c:1500}]); toast('Déménagement fait : ton atelier s’agrandit.',en); render(); }
  else if(a==='buy'){ const prix=96000,ap=prix*.2; if(ap>treso()) return fail(`Il faut ${fmt(ap)} d’apport. Ta trésorerie ne suffit pas.`); S.local={...S.local,proprio:true,prixBati:prix*.8}; S.prets.push({lib:'Prêt immobilier sur 20 ans',capital:prix-ap,restant:prix-ap,taux:r2(ESTR+1.6),duree:240,mensualite:mensualite(prix-ap,r2(ESTR+1.6),240)}); const en=post('Achat de l’immeuble',[{a:'213',d:prix},{a:'512',c:ap},{a:'164',c:prix-ap}]); toast('Tu es propriétaire de tes murs. Plus de loyer.',en); render(); }
  else if(a==='demo'){ S.demo=true; render(); }
  else if(a==='openshop'){ const em=EMPLACEMENTS.find(x=>x.id===UI.mag.e); const c=18000+em.loyer*3; if(c>treso()) return fail(`Il faut ${fmt(c)} de trésorerie. Emprunte d’abord à la banque.`); S.magasin={...em}; S.desirabilite=Math.max(0,S.desirabilite+em.de); S.notoriete=Math.min(100,S.notoriete+4); const en=post('Ouverture du magasin',[{a:'2135',d:18000},{a:'275',d:em.loyer*3},{a:'512',c:c}]); checkMissions(); toast(`${em.nom} : ton magasin est ouvert.`,en); render(); }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-b],[data-item]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));} });
document.addEventListener('mouseover',e=>{ if(!UI.place) return; const t=e.target.closest('.tile'); if(!t) return; const h=[+t.dataset.x,+t.dataset.y]; if(UI.hover&&UI.hover[0]===h[0]&&UI.hover[1]===h[1]) return; UI.hover=h; const el=document.getElementById('asvg'); if(el) el.innerHTML=atelierSVG(); });
document.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k) return; const val=e.target.type==='number'||e.target.type==='range'?+e.target.value:e.target.value; setPath(k,val);
  if(k==='prod.q'){document.getElementById('pq').textContent=val;document.getElementById('prodsum').innerHTML=prodSum();}
  else if(k.startsWith('soc.')){const F=FORMES[UI.soc.forme];const v=V.societe;const tmp=document.createElement('div');tmp.innerHTML=v();document.getElementById('socsum').innerHTML=tmp.querySelector('#socsum').innerHTML;}
  else if(k.startsWith('prix.')){const p=k.split('.')[1];document.getElementById('pv-'+p).textContent=fmt(val);for(const q in REF){const el=document.getElementById('pi-'+q);if(el)el.textContent=priceInfo(q);}renderStats();}
  else if(k==='bk.m'){ document.getElementById('bm').textContent=fmt(val); }
  else if(k==='bk.d'){ render(); const el=document.getElementById('b-d'); if(el) el.focus(); }
  else if(k==='emb.contrat'){}
});
document.addEventListener('change',e=>{ const k=e.target.dataset.k||''; if(k.startsWith('prix.')||k==='bk.m'){ const id=e.target.id; render(); const el=document.getElementById(id); if(el) el.focus(); } });

go();
</script>
