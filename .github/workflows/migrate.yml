name: Migrate Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation : liste les migrations en attente sans rien appliquer"
        type: boolean
        default: true

permissions:
  contents: read
  statuses: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Par défaut une migration s'applique dès la fusion, avant la fin du déploiement Vercel
      # (le nouveau code trouve ainsi ses nouvelles colonnes). Une migration marquée
      # « kapital:apres-deploiement » (ex. 0043, remise à zéro pour l'horloge réelle) attend au
      # contraire que le nouveau code soit en ligne : l'ancien code ne doit jamais tourner sur
      # les données migrées. Si le déploiement échoue, rien n'est appliqué.
      - name: Attendre la mise en ligne Vercel (migrations marquées kapital:apres-deploiement)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nouvelles=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations || true)
          if [ -z "$nouvelles" ] || ! grep -l "kapital:apres-deploiement" $nouvelles > /dev/null 2>&1; then
            echo "Aucune migration à appliquer après le déploiement : on continue."
            exit 0
          fi
          echo "Migration à appliquer après la mise en ligne du code : attente du déploiement Vercel de ${{ github.sha }}."
          for i in $(seq 1 90); do
            etat=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" \
              --jq '[.[] | select(.context | startswith("Vercel"))][0].state // "absent"')
            echo "Vercel : $etat"
            case "$etat" in
              success)
                echo "Nouveau code en ligne. 60 s pour laisser finir les requêtes de l'ancien code."
                sleep 60
                exit 0
                ;;
              failure|error)
                echo "Le déploiement Vercel a échoué : migration non appliquée."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Pas de déploiement Vercel réussi après 15 minutes : migration non appliquée."
          exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Depuis la version 3 de la CLI, `db push` vise la base locale par défaut :
      # --remote est obligatoire pour viser le projet lié. Un lancement manuel est une
      # simulation par défaut ; un push sur main applique pour de vrai.
      # --yes : la CLI demande une confirmation et un job automatique ne peut pas la poser.
      - name: Apply migrations
        run: |
          supabase link --project-ref yuezuirmpmlxxyrzpdpf
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.simulation }}" = "true" ]; then
            supabase db push --remote --dry-run
          else
            supabase db push --remote --yes
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
