name: Migrate Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation : liste les migrations en attente sans rien appliquer"
        type: boolean
        default: true

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Depuis la version 3 de la CLI, `db push` vise la base locale par défaut :
      # --remote est obligatoire pour viser le projet lié. Un lancement manuel est une
      # simulation par défaut ; un push sur main applique pour de vrai.
      - name: Apply migrations
        run: |
          supabase link --project-ref yuezuirmpmlxxyrzpdpf
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.simulation }}" = "true" ]; then
            supabase db push --remote --dry-run
          else
            supabase db push --remote
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
